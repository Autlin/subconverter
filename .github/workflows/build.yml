name: Linux Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the selected tag as a GitHub Release
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            artifact: subconverter_linux_amd64
            expected_machine: x86-64
            image_arch: amd64
            os: ubuntu-latest
          - arch: arm64
            artifact: subconverter_linux_arm64
            expected_machine: ARM aarch64
            image_arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Linux ${{ matrix.arch }} Build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/root/workdir" \
            "multiarch/alpine:${{ matrix.image_arch }}-latest-stable" \
            /bin/sh -c "apk add bash git nodejs npm && cd /root/workdir && chmod +x scripts/build.alpine.release.sh && bash scripts/build.alpine.release.sh"

      - name: Verify architecture, startup, and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' src/version.h)"
          expected="SubConverter Mi ${version} Backend"

          file_output="$(file subconverter/subconverter)"
          printf '%s\n' "${file_output}"
          grep --fixed-strings --quiet "${{ matrix.expected_machine }}" <<<"${file_output}"
          pushd subconverter >/dev/null
          ./subconverter >../subconverter-startup.log 2>&1 &
          pid=$!
          trap 'kill "${pid}" 2>/dev/null || true' EXIT

          response=""
          for _ in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:25500/version)"; then
              break
            fi
            sleep 1
          done

          if [[ "${response}" != "${expected}" ]]; then
            cat ../subconverter-startup.log
            printf 'Expected: %s\nActual: %s\n' "${expected}" "${response}"
            exit 1
          fi

          kill "${pid}"
          wait "${pid}" || true
          trap - EXIT
          rm -f pref.toml
          popd >/dev/null
          printf 'Verified: %s\n' "${response}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: subconverter/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: ${{ inputs.publish_release && startsWith(github.ref, 'refs/tags/v') }}
    needs: linux_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v4

      - name: Verify tag matches local version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' src/version.h)"
          test "${version}" = "${GITHUB_REF_NAME}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: subconverter_linux_*

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          for arch in amd64 arm64; do
            artifact="subconverter_linux_${arch}"
            rm -rf package/subconverter
            cp -R "release-artifacts/${artifact}" package/subconverter
            tar czf "${artifact}.tar.gz" -C package subconverter
          done
          sha256sum subconverter_linux_amd64.tar.gz subconverter_linux_arm64.tar.gz > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            subconverter_linux_amd64.tar.gz
            subconverter_linux_arm64.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
