name: GitHub CI
on:
  push:
    branches: [ master ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter_linux32
            image_digest: sha256:da8e7afa12ad34df9341f149e9d24b557c7e524ecb87c69bff2916a16d04f746
            os: ubuntu-latest
            qemu: true
          - arch: amd64
            artifact: subconverter_linux64
            image_digest: sha256:2fee8d2c1f48926bfb3fa65ed559f776856914f47c84f9fc48bf8ad0f2db5df8
            os: ubuntu-latest
            qemu: false
          - arch: armv7
            artifact: subconverter_armv7
            image_digest: sha256:01551e7b433b231fc0175db3ed6dff0f4b7c30007f68c20c9854bd087c5c61d3
            os: ubuntu-latest
            qemu: true
          - arch: aarch64
            artifact: subconverter_aarch64
            image_digest: sha256:89cfb80d20c0799839214fb9a7fc1fb425be59af1d79d793b3cca7fe4ed2b338
            os: ubuntu-24.04-arm
            qemu: false
    runs-on: ${{ matrix.os }}
    name: Linux ${{ matrix.arch }} Build
    steps:
      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache/${{ matrix.arch }}
          key: linux-ccache-${{ matrix.arch }}-gcc-${{ matrix.image_digest }}-${{ hashFiles('scripts/build.alpine.release.sh', 'scripts/rules_config.conf', 'scripts/update_rules.py') }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-${{ matrix.arch }}-gcc-${{ matrix.image_digest }}-${{ hashFiles('scripts/build.alpine.release.sh', 'scripts/rules_config.conf', 'scripts/update_rules.py') }}-
            linux-ccache-${{ matrix.arch }}-gcc-${{ matrix.image_digest }}-
      - name: Add commit id into version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: SHA=$(git rev-parse --short HEAD) && sed -i 's/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)/\1-'"$SHA"'/' src/version.h
      - name: Build
        run: docker run --rm -e CCACHE_DIR=/root/workdir/.ccache/${{ matrix.arch }} -e CCACHE_BASEDIR=/root/workdir -e CCACHE_COMPILERCHECK=content -e CCACHE_MAXSIZE=750M -e CCACHE_COMPRESS=1 -e CC='ccache gcc' -e CXX='ccache g++' -v $GITHUB_WORKSPACE:/root/workdir multiarch/alpine:${{ matrix.arch }}-latest-stable@${{ matrix.image_digest }} /bin/sh -c "apk add bash git nodejs npm && cd /root/workdir && chmod +x scripts/build.alpine.release.sh && bash scripts/build.alpine.release.sh"
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: subconverter/

  release:
    name: Publish GitHub Release
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs: [linux_build, macos_build, windows_build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: subconverter_*

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          for artifact in subconverter_linux32 subconverter_linux64 subconverter_armv7 subconverter_aarch64 subconverter_darwin64 subconverter_darwinarm; do
            rm -rf package/subconverter
            cp -R "release-artifacts/${artifact}" package/subconverter
            tar czf "${artifact}.tar.gz" -C package subconverter
          done
          for artifact in subconverter_win32 subconverter_win64; do
            rm -rf package/subconverter
            cp -R "release-artifacts/${artifact}" package/subconverter
            (cd package && 7z a -t7z "${GITHUB_WORKSPACE}/${artifact}.7z" subconverter >/dev/null)
          done
          sha256sum *.tar.gz *.7z > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            *.tar.gz
            *.7z
            SHA256SUMS
          draft: false

  macos_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter_darwin64
            os: macos-15
          - arch: arm
            artifact: subconverter_darwinarm
            os: macos-15
    runs-on: ${{ matrix.os }}
    name: macOS ${{ matrix.arch }} Build
    steps:
      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Add commit id into version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: SHA=$(git rev-parse --short HEAD) && sed -i '' 's/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)/\1-'"$SHA"'/' src/version.h
      - name: Build
        run: bash scripts/build.macos.release.sh
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: subconverter/

  windows_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter_win32
            env: i686
            msystem: MINGW32
          - arch: amd64
            artifact: subconverter_win64
            env: x86_64
            msystem: MINGW64
    runs-on: windows-latest
    name: Windows ${{ matrix.arch }} Build
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '16'
      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          update: true
          install: base-devel git mingw-w64-${{ matrix.env }}-gcc mingw-w64-${{ matrix.env }}-cmake mingw-w64-${{ matrix.env }}-pcre2 patch
          msystem: ${{ matrix.msystem }}
          path-type: inherit
      - name: Add commit id into version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: SHA=$(git rev-parse --short HEAD) && sed -i 's/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)/\1-'"$SHA"'/' src/version.h
      - name: Build
        run: bash scripts/build.windows.release.sh
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: subconverter/
